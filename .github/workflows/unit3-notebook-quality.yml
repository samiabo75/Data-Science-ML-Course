name: Unit3 Meetings 17-29 notebook execution
on:
  pull_request:
    paths:
      - '01-Unit3-Data-Science-ML/Lesson-Plans-2026-2027/Professional-Course-90H/**'
      - 'Datasets/*.csv'
      - '.github/workflows/unit3-notebook-quality.yml'
  workflow_dispatch:

jobs:
  run-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2' 'nbformat>=5,<6' 'nbclient>=0.9,<1' 'ipykernel>=6,<8' 'matplotlib>=3.8,<4' 'seaborn>=0.13,<1'
      - name: Execute teacher notebooks
        env:
          MPLBACKEND: Agg
        run: |
          python 01-Unit3-Data-Science-ML/Lesson-Plans-2026-2027/Professional-Course-90H/scripts/run_audited_notebooks.py --out quality-run-report.json
      - name: Execute completed student notebooks
        env:
          MPLBACKEND: Agg
        run: |
          python 01-Unit3-Data-Science-ML/Lesson-Plans-2026-2027/Professional-Course-90H/scripts/run_completed_student_notebooks.py --out student-quality-run-report.json
      - name: Save machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit3-meetings-17-29-quality
          path: |
            quality-run-report.json
            student-quality-run-report.json
          if-no-files-found: warn
