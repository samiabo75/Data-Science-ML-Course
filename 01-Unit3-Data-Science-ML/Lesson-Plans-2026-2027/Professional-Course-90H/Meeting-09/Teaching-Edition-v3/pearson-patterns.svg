<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="365" viewBox="0 0 1010 365" role="img" aria-label="Three scatter patterns: positive straight line r plus 1, negative straight line r minus 1, and U shaped exact quadratic relationship r zero">
<rect width="1010" height="365" fill="white"/><text x="505" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#17344f">Pearson measures linear association, not every relationship</text>
<rect x="20" y="76" width="288" height="220" rx="9" fill="#fbfcfe" stroke="#c8d5df"/><text x="164" y="104" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#17344f">Positive linear</text><line x1="68" y1="254" x2="283" y2="254" stroke="#415f77"/><line x1="68" y1="254" x2="68" y2="119" stroke="#415f77"/><circle cx="68" cy="220.25" r="6.5" fill="#22848c"/><circle cx="139.66666666666666" cy="186.5" r="6.5" fill="#22848c"/><circle cx="211.33333333333331" cy="152.75" r="6.5" fill="#22848c"/><circle cx="283" cy="119" r="6.5" fill="#22848c"/><text x="164" y="286" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#394f63">r = +1</text>
<rect x="361" y="76" width="288" height="220" rx="9" fill="#fbfcfe" stroke="#c8d5df"/><text x="505" y="104" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#17344f">Negative linear</text><line x1="409" y1="254" x2="624" y2="254" stroke="#415f77"/><line x1="409" y1="254" x2="409" y2="119" stroke="#415f77"/><circle cx="409" cy="119" r="6.5" fill="#d08448"/><circle cx="480.66666666666663" cy="152.75" r="6.5" fill="#d08448"/><circle cx="552.3333333333333" cy="186.5" r="6.5" fill="#d08448"/><circle cx="624" cy="220.25" r="6.5" fill="#d08448"/><text x="505" y="286" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#394f63">r = -1</text>
<rect x="702" y="76" width="288" height="220" rx="9" fill="#fbfcfe" stroke="#c8d5df"/><text x="846" y="104" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#17344f">Quadratic U shape</text><line x1="750" y1="254" x2="965" y2="254" stroke="#415f77"/><line x1="750" y1="254" x2="750" y2="119" stroke="#415f77"/><circle cx="750" cy="119" r="6.5" fill="#7159b0"/><circle cx="803.75" cy="220.25" r="6.5" fill="#7159b0"/><circle cx="857.5" cy="254" r="6.5" fill="#7159b0"/><circle cx="911.25" cy="220.25" r="6.5" fill="#7159b0"/><circle cx="965" cy="119" r="6.5" fill="#7159b0"/><text x="846" y="286" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#394f63">r = 0; y = x squared</text>
<text x="505" y="338" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526879">All series are synthetic; U-shape has a perfect nonlinear dependency despite zero Pearson r.</text></svg>