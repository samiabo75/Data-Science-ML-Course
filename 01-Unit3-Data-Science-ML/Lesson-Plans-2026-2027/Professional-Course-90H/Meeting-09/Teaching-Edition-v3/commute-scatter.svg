<svg xmlns="http://www.w3.org/2000/svg" width="950" height="500" viewBox="0 0 950 500" role="img" aria-label="Illustrative scatter plot of four school trips distances 1 2 3 4 km and durations 10 30 20 40 minutes; Pearson r is 0.8">
<rect width="950" height="500" fill="#fff"/><text x="475" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#16324c">Distance and travel time: illustrative observations</text><text x="475" y="66" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#53687b">Same-row pairs | Pearson r = 0.8 | correlation is not causation</text>
<line x1="110" y1="405" x2="855" y2="405" stroke="#35526b" stroke-width="2"/><line x1="110" y1="405" x2="110" y2="72" stroke="#35526b" stroke-width="2"/><g font-family="Arial,sans-serif" font-size="17" fill="#35526b"><text x="170" y="433" text-anchor="middle">1</text><text x="370" y="433" text-anchor="middle">2</text><text x="570" y="433" text-anchor="middle">3</text><text x="770" y="433" text-anchor="middle">4</text><text x="90" y="323.5" text-anchor="end">10</text><text x="90" y="251" text-anchor="end">20</text><text x="90" y="178.5" text-anchor="end">30</text><text x="90" y="106" text-anchor="end">40</text></g><circle cx="170" cy="317.5" r="9" fill="#227d9a" stroke="#fff" stroke-width="2"/><text x="181" y="308.5" font-family="Arial,sans-serif" font-size="15" fill="#263c50">1 km, 10 min</text><circle cx="370" cy="172.5" r="9" fill="#227d9a" stroke="#fff" stroke-width="2"/><text x="381" y="163.5" font-family="Arial,sans-serif" font-size="15" fill="#263c50">2 km, 30 min</text><circle cx="570" cy="245" r="9" fill="#227d9a" stroke="#fff" stroke-width="2"/><text x="581" y="236" font-family="Arial,sans-serif" font-size="15" fill="#263c50">3 km, 20 min</text><circle cx="770" cy="100" r="9" fill="#227d9a" stroke="#fff" stroke-width="2"/><text x="781" y="91" font-family="Arial,sans-serif" font-size="15" fill="#263c50">4 km, 40 min</text>
<text x="475" y="472" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#1c3c55">Distance to school (km)</text><text x="28" y="240" transform="rotate(-90 28 240)" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1c3c55">Travel time (min)</text>
