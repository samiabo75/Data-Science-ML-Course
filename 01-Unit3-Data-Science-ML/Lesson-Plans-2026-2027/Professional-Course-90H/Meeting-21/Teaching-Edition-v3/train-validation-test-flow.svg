<g font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" fill="#203040">
<text x="188" y="235" font-size="27" font-weight="bold">TRAIN</text>
<text x="188" y="275" font-size="18">אימון המודל והכנת נתונים</text>
<text x="188" y="305" font-size="18">לימוד פרמטרים</text>
<text x="530" y="235" font-size="27" font-weight="bold">VALIDATION</text>
<text x="530" y="275" font-size="18">השוואת מודלים מועמדים</text>
<text x="530" y="305" font-size="18">בחירת מודל או K</text>
