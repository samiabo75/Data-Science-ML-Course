<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 405"><rect width="1060" height="405" fill="#fff"/><text x="530" y="49" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">Train → Validation → Test (roles, not a sequential data transfer)</text><rect x="45" y="115" width="285" height="175" rx="12" fill="#dbeaf7" stroke="#477dad" stroke-width="2"/><rect x="390" y="115" width="285" height="175" rx="12" fill="#fff0d8" stroke="#be9250" stroke-width="2"/><rect x="735" y="115" width="285" height="175" rx="12" fill="#e0f2e3" stroke="#60966c" stroke-width="2"/><g font-family="Arial" text-anchor="middle" fill="#243344"><text x="187" y="158" font-size="29" font-weight="bold">TRAIN</text><text x="187" y="205" font-size="19">Fit model and preprocessing</text><text x="187" y="240" font-size="19">Learn parameters</text><text x="532" y="158" font-size="29" font-weight="bold">VALIDATION</text><text x="532" y="205" font-size="19">Choose model / K</text><text x="532" y="240" font-size="19">Compare candidates</text><text x="876" y="158" font-size="29" font-weight="bold">TEST</text><text x="876" y="205" font-size="19">Evaluate once at end</text><text x="876" y="240" font-size="19">Do not tune from results</text></g><path d="M330 195 L380 195" stroke="#3c5162" stroke-width="4"/><path d="M368 185 L383 195 L368 205" stroke="#3c5162" stroke-width="4" fill="none"/><path d="M675 195 L725 195" stroke="#3c5162" stroke-width="4"/><path d="M713 185 L728 195 L713 205" stroke="#3c5162" stroke-width="4" fill="none"/><text x="530" y="348" text-anchor="middle" font-family="Arial" font-size="21">Set the split and metric before model comparison</text><text x="530" y="376" text-anchor="middle" font-family="Arial" font-size="18">No preprocessing fit or hyperparameter selection on Test</text></svg>