<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="680" viewBox="0 0 1250 680" role="img" aria-label="Correct machine-learning train and test flow. Split source into Train and Test. Train alone supplies means, scaler fit and KNN fit. Test X is transformed by the Train scaler and fed to KNN predict. Held-out y Test is used only at final comparison for accuracy and error analysis. No Test inputs learn fit parameters or choose K."><rect width="1250" height="680" fill="white"/><text x="625" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#173e56">Train fits the preparation and KNN; Test evaluates only</text>
<rect x="376" y="62" width="498" height="83" rx="12" fill="#eaf2f9" stroke="#b9cbd6"/><text x="625" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#214660">Source: Penguins and X / y</text><text x="625" y="123" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#486a7e">Target species kept separate from features</text>
<path d="M625 145 V169 H340 V187 M625 169 H910 V187" stroke="#587f90" stroke-width="3" fill="none"/>
<rect x="64" y="188" width="552" height="82" rx="12" fill="#e4f3e8" stroke="#b9cbd6"/><text x="340" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#214660">TRAIN set (258 rows)</text><text x="340" y="249" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#486a7e">Features X_train and known labels y_train</text>
<rect x="646" y="188" width="552" height="82" rx="12" fill="#fff0e3" stroke="#b9cbd6"/><text x="922" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#214660">TEST set (86 rows)</text><text x="922" y="249" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#486a7e">Features X_test; labels y_test withheld</text>
<path d="M340 270 V293" stroke="#298467" stroke-width="3"/>
<rect x="64" y="296" width="552" height="82" rx="12" fill="#e4f3e8" stroke="#b9cbd6"/><text x="340" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#214660">Train preparation: fit</text><text x="340" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#486a7e">Learn means and StandardScaler on Train only</text>
<path d="M340 378 V407" stroke="#298467" stroke-width="3"/>
<rect x="64" y="410" width="552" height="88" rx="12" fill="#e4f3e8" stroke="#b9cbd6"/><text x="340" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#214660">KNN.fit(Train X, Train y)</text><text x="340" y="471" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#486a7e">Fixed K=3; uniform Euclidean neighbors</text>
<rect x="646" y="410" width="552" height="88" rx="12" fill="#fff0e3" stroke="#b9cbd6"/><text x="922" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#214660">Transform Test X, then predict(X)</text><text x="922" y="471" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#486a7e">Use Train parameters and trained KNN</text>
<path d="M910 270 V407" stroke="#bc8559" stroke-width="3" stroke-dasharray="9 6"/>
<path d="M616 339 H633 V434 H646" stroke="#2d886f" stroke-width="3" fill="none" stroke-dasharray="7 5"/>
<text x="635" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#237861">Scaler</text>
<path d="M616 452 H646" stroke="#2d886f" stroke-width="3"/>
<text x="631" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#237861">Model</text>
<path d="M910 498 V530" stroke="#587f90" stroke-width="3"/>
<rect x="302" y="532" width="646" height="88" rx="12" fill="#f0eef9" stroke="#b9cbd6"/><text x="625" y="562" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#214660">Compare Test predictions with held-out y_test</text><text x="625" y="593" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#486a7e">actual / predicted / correct; Accuracy and errors</text>
<text x="625" y="654" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#945d40">Do not fit on Test or choose K/features using the reported Test score.</text></svg>