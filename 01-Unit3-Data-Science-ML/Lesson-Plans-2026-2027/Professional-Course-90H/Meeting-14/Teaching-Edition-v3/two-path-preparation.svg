<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-label="ColumnTransformer diagram: input numeric age takes median imputation then StandardScaler; categorical group takes OneHotEncoder trained on Train. Both paths join to three columns; New data only Transform.">
<rect width="1080" height="500" fill="white"/><text x="540" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1c3f5a">One table, two preparation paths — Fit on Train only</text>
<rect x="363" y="72" width="355" height="85" rx="13" fill="#edf2f9" stroke="#a7c2ce"/><text x="540.5" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#234c64">TRAIN table</text><text x="540.5" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#406378">age (numeric) + group (nominal)</text>
<path d="M540 157 V185 H273 V205 M540 185 H807 V205" fill="none" stroke="#4c7890" stroke-width="3"/>
<rect x="55" y="205" width="434" height="86" rx="13" fill="#e4f4ef" stroke="#a7c2ce"/><text x="272" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#234c64">NUMERIC: age</text><text x="272" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#406378">Median fill, then StandardScaler</text>
<rect x="590" y="205" width="435" height="86" rx="13" fill="#e9f0fc" stroke="#a7c2ce"/><text x="807.5" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#234c64">CATEGORICAL: group</text><text x="807.5" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#406378">OneHotEncoder (ignore unknown)</text>
<path d="M273 291 V329 H540 V346 M807 291 V329 H540" fill="none" stroke="#4c7890" stroke-width="3"/>
<rect x="310" y="346" width="470" height="92" rx="13" fill="#f4f5fa" stroke="#a7c2ce"/><text x="545" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#234c64">Combined fixed feature schema</text><text x="545" y="406" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#406378">numeric__age | group_A | group_B</text>
<text x="540" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#61788b">New/Test bypass FIT and use Transform with the same learned parameters and column order.</text></svg>