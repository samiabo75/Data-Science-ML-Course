<text x="460" y="69" font-family="Arial,sans-serif" fill="#53697a" font-size="16" text-anchor="middle">head(2) previews the highlighted first two rows — the source stays 4 x 4</text>
<rect x="85" y="100" width="750" height="54" rx="5" fill="#294b68"/>
