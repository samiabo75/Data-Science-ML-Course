<rect x="138" y="185" width="184" height="24" rx="5" fill="#fff7ee"/>
<text x="147" y="203" font-size="15" font-family="Arial,sans-serif" fill="#8e4f28">Budget = 2,500 NIS</text>
<g fill="#17334c" font-family="Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle">
<text x="255.5" y="230">2100</text><text x="422.5" y="194">2700</text><text x="589.5" y="140">3600</text><text x="756.5" y="212">2400</text>
</g>
<g fill="#17334c" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">
