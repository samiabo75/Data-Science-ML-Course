<text x="115" y="370">0</text><text x="115" y="310">1000</text><text x="115" y="250">2000</text><text x="115" y="190">3000</text><text x="115" y="130">4000</text>
</g>
<g>
<rect x="203" y="239" width="105" height="126" rx="5" fill="#2c9c92"/>
<rect x="370" y="203" width="105" height="162" rx="5" fill="#628db8"/>
<rect x="537" y="149" width="105" height="216" rx="5" fill="#628db8"/>
<rect x="704" y="221" width="105" height="144" rx="5" fill="#2c9c92"/>
</g>
