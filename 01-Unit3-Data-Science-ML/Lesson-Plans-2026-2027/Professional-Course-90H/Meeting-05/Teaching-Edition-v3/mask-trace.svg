<g font-family="Arial,sans-serif" text-anchor="middle" font-size="19">
<rect x="65" y="75" width="810" height="49" rx="6" fill="#d5f3e9" stroke="#cad7dc"/><text x="135" y="105" fill="#17344d">A</text><text x="295" y="105" fill="#17344d">2100 NIS</text><text x="520" y="105" fill="#17344d">2100 <= 2500</text><text x="760" y="105" font-weight="bold" fill="#17344d">True</text><rect x="65" y="130" width="810" height="49" rx="6" fill="#f4e7e7" stroke="#cad7dc"/><text x="135" y="160" fill="#17344d">B</text><text x="295" y="160" fill="#17344d">2700 NIS</text><text x="520" y="160" fill="#17344d">2700 <= 2500</text><text x="760" y="160" font-weight="bold" fill="#17344d">False</text><rect x="65" y="185" width="810" height="49" rx="6" fill="#f4e7e7" stroke="#cad7dc"/><text x="135" y="215" fill="#17344d">C</text><text x="295" y="215" fill="#17344d">3600 NIS</text><text x="520" y="215" fill="#17344d">3600 <= 2500</text><text x="760" y="215" font-weight="bold" fill="#17344d">False</text><rect x="65" y="240" width="810" height="49" rx="6" fill="#d5f3e9" stroke="#cad7dc"/><text x="135" y="270" fill="#17344d">D</text><text x="295" y="270" fill="#17344d">2400 NIS</text><text x="520" y="270" fill="#17344d">2400 <= 2500</text><text x="760" y="270" font-weight="bold" fill="#17344d">True</text>
