<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="400" viewBox="0 0 1130 400" role="img" aria-label="Nine sorted values 8 10 10 12 14 16 20 20 40 split into lower four upper four excluding median 14; Q1 10 and Q3 20">
<rect width="1130" height="400" fill="white"/><text x="565" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#16415c" font-weight="bold">Quartiles by median-of-halves (odd n: omit the median)</text>
<rect x="60" y="117" width="96" height="88" rx="10" fill="#dff0f4" stroke="#acced1"/><text x="108" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#173c56">8</text><rect x="176" y="117" width="96" height="88" rx="10" fill="#dff0f4" stroke="#acced1"/><text x="224" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#173c56">10</text><rect x="292" y="117" width="96" height="88" rx="10" fill="#dff0f4" stroke="#acced1"/><text x="340" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#173c56">10</text><rect x="408" y="117" width="96" height="88" rx="10" fill="#dff0f4" stroke="#acced1"/><text x="456" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#173c56">12</text><rect x="524" y="117" width="96" height="88" rx="10" fill="#ffeacf" stroke="#bd873f"/><text x="572" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#173c56">14</text><rect x="640" y="117" width="96" height="88" rx="10" fill="#e7f5e8" stroke="#acced1"/><text x="688" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#173c56">16</text><rect x="756" y="117" width="96" height="88" rx="10" fill="#e7f5e8" stroke="#acced1"/><text x="804" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#173c56">20</text><rect x="872" y="117" width="96" height="88" rx="10" fill="#e7f5e8" stroke="#acced1"/><text x="920" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#173c56">20</text><rect x="988" y="117" width="96" height="88" rx="10" fill="#e7f5e8" stroke="#acced1"/><text x="1036" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#173c56">40</text>
<text x="286" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#306d82">Lower half: 8, 10, 10, 12</text>
<text x="578" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#986a32">Q2 = 14 (omit from halves)</text>
<text x="861" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#35734d">Upper half: 16, 20, 20, 40</text>
<text x="290" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#245d70">Q1=(10+10)/2=10</text>
<text x="865" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#2c6b45">Q3=(20+20)/2=20</text>
<text x="565" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#173d58">IQR = Q3 - Q1 = 10 minutes. This sample also matches Pandas linear quartiles.</text></svg>