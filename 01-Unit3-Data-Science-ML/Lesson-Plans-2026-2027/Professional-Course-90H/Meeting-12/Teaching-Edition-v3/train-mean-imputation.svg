<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-label="Synthetic imputation example: train 10 20 missing yields mean 15, test 1000 missing uses 15; using all known data including test 1000 leaks information and yields 343.33">
<rect width="1200" height="570" fill="white"/><text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173e59">One learned Train mean. Two groups transformed.</text>
<rect x="58" y="85" width="505" height="99" rx="13" fill="#e4f2e9" stroke="#b7c5d0" stroke-width="1.4"/><text x="310.5" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#16394e">TRAIN values (minutes)</text><text x="310.5" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#375b71">10, 20, missing</text>
<rect x="637" y="85" width="505" height="99" rx="13" fill="#fff0e5" stroke="#b7c5d0" stroke-width="1.4"/><text x="889.5" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#16394e">TEST values (minutes)</text><text x="889.5" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#375b71">1000, missing</text>
<path d="M306 184 V215" stroke="#318060" stroke-width="3"/><text x="306" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#215941">Train mean = (10 + 20) / 2 = 15</text>
<path d="M306 250 V275 H890 V298" fill="none" stroke="#318060" stroke-width="3"/><path d="M306 250 V298" fill="none" stroke="#318060" stroke-width="3"/>
<rect x="58" y="301" width="505" height="94" rx="13" fill="#e4f2e9" stroke="#b7c5d0" stroke-width="1.4"/><text x="310.5" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#16394e">TRAIN after fill</text><text x="310.5" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#375b71">10, 20, 15</text>
<rect x="637" y="301" width="505" height="94" rx="13" fill="#e4f2e9" stroke="#b7c5d0" stroke-width="1.4"/><text x="889.5" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#16394e">TEST after same fill</text><text x="889.5" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#375b71">1000, 15</text>
<line x1="70" y1="431" x2="1130" y2="431" stroke="#d9a78d" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="120" y="457" width="960" height="74" rx="12" fill="#fae9e8" stroke="#c47873"/>
<text x="600" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#963e3d" font-weight="bold">LEAKAGE: learning from Train AND Test</text>
<text x="600" y="514" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#963e3d">(10 + 20 + 1000) / 3 = 343.33 minutes — invalid for model preparation</text>
<text x="600" y="554" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#607585">All numbers are invented for teaching; Test values are revealed only to demonstrate what leakage means.</text></svg>