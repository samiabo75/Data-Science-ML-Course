<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 545" width="1200" height="545" role="img" aria-label="Schematic paired X and y from 344 penguins split together into 258 Train and 86 held-out Test. Only Train learns parameters; no Test to fit.">
<rect width="1200" height="545" fill="white"/><text x="600" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#14364f">Split paired observations before learning any imputation parameter</text>
<rect x="75" y="85" width="465" height="100" rx="13" fill="#e6f2f5" stroke="#b7c5d0" stroke-width="1.4"/><text x="307.5" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#16394e">X: 344 rows x 2 numeric features</text><text x="307.5" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#375b71">Flipper length (mm) and body mass (g)</text>
<rect x="660" y="85" width="465" height="100" rx="13" fill="#f0eaf5" stroke="#b7c5d0" stroke-width="1.4"/><text x="892.5" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#16394e">y: 344 species labels</text><text x="892.5" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#375b71">One label for the same penguin row</text>
<line x1="540" y1="135" x2="660" y2="135" stroke="#38617a" stroke-width="3" stroke-dasharray="7 6"/><text x="600" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b73">paired</text>
<path d="M600 191 V232 M600 232 H315 V262 M600 232 H885 V262" fill="none" stroke="#3f647c" stroke-width="3"/>
<rect x="85" y="262" width="470" height="113" rx="13" fill="#e3f3e9" stroke="#b7c5d0" stroke-width="1.4"/><text x="320" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#16394e">TRAIN (258 paired rows)</text><text x="320" y="324" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#375b71">Learn mean from X_train only; keep y_train</text>
<rect x="645" y="262" width="470" height="113" rx="13" fill="#fff0e1" stroke="#b7c5d0" stroke-width="1.4"/><text x="880" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#16394e">TEST (86 paired rows)</text><text x="880" y="324" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#375b71">Held out: transform with TRAIN mean only</text>
<path d="M320 375 V403" fill="none" stroke="#318057" stroke-width="3"/><path d="M882 375 V403" fill="none" stroke="#c38243" stroke-width="3"/>
<rect x="93" y="406" width="450" height="91" rx="13" fill="#e3f3e9" stroke="#b7c5d0" stroke-width="1.4"/><text x="318" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#16394e">FIT parameters on Train</text><text x="318" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#375b71">then transform X_train</text>
<rect x="655" y="406" width="450" height="91" rx="13" fill="#fff0e1" stroke="#b7c5d0" stroke-width="1.4"/><text x="880" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#16394e">NO FIT on Test</text><text x="880" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#375b71">apply same parameter to X_test</text>
<text x="600" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#556d7b">Teaching flow for independent records. Time-based or grouped records may require a different split.</text></svg>