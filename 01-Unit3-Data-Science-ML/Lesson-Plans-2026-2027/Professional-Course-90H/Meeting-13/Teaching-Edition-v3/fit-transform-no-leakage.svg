<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img" aria-label="Only Train 10 20 30 feeds Fit; Test 40 bypasses Fit via an orange path directly to its Transform; fitted parameters min max mean sigma are reused."><rect width="1200" height="515" fill="#fff"/><text x="600" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#173a56">Fit on Train. Transform Test without learning from it.</text>
<rect x="60" y="80" width="470" height="94" rx="12" fill="#e3f2e9" stroke="#b8cbd2"/><text x="295" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1e425c">TRAIN = 10, 20, 30</text><text x="295" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#335b71">Only source for scaler parameters</text>
<rect x="665" y="80" width="470" height="94" rx="12" fill="#fff1df" stroke="#b8cbd2"/><text x="900" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1e425c">TEST = 40</text><text x="900" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#335b71">Held out — no fitting</text>
<path d="M295 174 V218" stroke="#318060" stroke-width="3" fill="none"/>
<rect x="155" y="215" width="860" height="90" rx="12" fill="#eaf4f8" stroke="#b8cbd2"/><text x="585" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1e425c">FIT from TRAIN only</text><text x="585" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#335b71">Min=10, Max=30, Mean=20, Sigma≈8.165</text>
<path d="M405 305 V351 M795 305 V351" stroke="#318060" stroke-width="3" fill="none"/>
<path d="M899 174 H1166 V344 H1032 V355" stroke="#d4934c" stroke-width="3" fill="none" stroke-dasharray="9 7"/>
<text x="1147" y="256" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#9a6739" transform="rotate(-90 1147 256)">TEST data bypass FIT</text>
<rect x="95" y="356" width="490" height="92" rx="12" fill="#e2f2ea" stroke="#b8cbd2"/><text x="340" y="387" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1e425c">Transform TRAIN</text><text x="340" y="417" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#335b71">MinMax [0,0.5,1]  |  z [-1.225,0,+1.225]</text>
<rect x="610" y="356" width="490" height="92" rx="12" fill="#fff0dc" stroke="#b8cbd2"/><text x="855" y="387" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1e425c">Transform TEST with TRAIN scale</text><text x="855" y="417" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#335b71">40 maps to MinMax 1.5 and z 2.449</text>
<text x="600" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#ac6041">Never fit a new scaler on Test or fit on combined Train + Test.</text></svg>