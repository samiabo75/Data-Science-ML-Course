<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="Raw changes in laptop price and RAM have different units: 100 shekels vs 8 gigabytes. Using separate training ranges price 1000 to 3000 and RAM 8 to 24 yields MinMax differences 0.05 and 0.5."><rect width="1100" height="500" fill="white"/><text x="550" y="39" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#163950">Two laptop features, two units — why scaling matters</text>
<rect x="83" y="90" width="440" height="100" rx="12" fill="#eff7fc" stroke="#b8cbd2"/><text x="303" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1e425c">Computer A</text><text x="303" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#335b71">Price 2000 NIS | RAM 8 GB</text>
<rect x="577" y="90" width="440" height="100" rx="12" fill="#eff7fc" stroke="#b8cbd2"/><text x="797" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1e425c">Computer B</text><text x="797" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#335b71">Price 2100 NIS | RAM 16 GB</text>
<text x="550" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#21435d">Raw numeric differences: 100 NIS vs 8 GB — not directly comparable</text>
<line x1="210" y1="300" x2="950" y2="300" stroke="#536f82" stroke-width="2"/>
<rect x="215" y="274" width="65" height="52" fill="#58a59f"/><rect x="300" y="274" width="600" height="52" fill="#5d85b2"/>
<text x="247" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#2b605b">0.05</text><text x="600" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#335c82">0.50</text>
<text x="247" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315f5d">Price</text><text x="600" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315f82">RAM</text>
<text x="550" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#203e59">MinMax Train ranges: price [1000,3000], RAM [8,24]</text>
<text x="550" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#203e59">Scaled differences: 100/2000=0.05 and 8/16=0.5</text>
<text x="550" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#647a89">Synthetic illustration only: scaling does not decide the true importance of either feature.</text></svg>