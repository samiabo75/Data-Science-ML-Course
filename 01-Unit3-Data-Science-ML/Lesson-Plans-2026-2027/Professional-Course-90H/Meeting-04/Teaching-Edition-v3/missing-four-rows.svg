<svg xmlns="http://www.w3.org/2000/svg" width="850" height="360" viewBox="0 0 850 360" role="img" aria-label="Four first penguin rows: measured bill lengths 39.1 39.5 40.3 mm and one NA; missing rate 25 percent">
