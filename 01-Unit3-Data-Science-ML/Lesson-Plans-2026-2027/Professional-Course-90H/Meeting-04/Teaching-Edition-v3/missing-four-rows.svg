<rect x="265" y="95" width="140" height="78" rx="7" fill="#e1eff6" stroke="#5398bc"/>
<rect x="430" y="95" width="140" height="78" rx="7" fill="#e1eff6" stroke="#5398bc"/>
<rect x="595" y="95" width="140" height="78" rx="7" fill="#fff0e6" stroke="#ca8055"/>
<text x="170" y="126" font-size="14" fill="#456076">row 1</text><text x="335" y="126" font-size="14" fill="#456076">row 2</text><text x="500" y="126" font-size="14" fill="#456076">row 3</text><text x="665" y="126" font-size="14" fill="#8c4c2d">row 4</text>
