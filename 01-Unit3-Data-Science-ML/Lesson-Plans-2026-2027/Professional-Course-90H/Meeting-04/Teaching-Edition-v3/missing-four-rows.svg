<rect x="100" y="219" width="476" height="29" rx="4" fill="#3479ac"/><rect x="576" y="219" width="159" height="29" rx="4" fill="#cc7548"/>
<text x="338" y="240" fill="#fff" font-size="17" font-family="Arial,sans-serif" text-anchor="middle">3 known</text><text x="655" y="240" fill="#fff" font-size="17" font-family="Arial,sans-serif" text-anchor="middle">1 NA</text>
<text x="425" y="289" text-anchor="middle" fill="#223951" font-size="21" font-family="Arial,sans-serif">1 / 4 = 25% missing within this four-row example</text>
<text x="425" y="325" text-anchor="middle" fill="#627588" font-size="15" font-family="Arial,sans-serif">Do not generalize 25% to all 344 rows</text>
