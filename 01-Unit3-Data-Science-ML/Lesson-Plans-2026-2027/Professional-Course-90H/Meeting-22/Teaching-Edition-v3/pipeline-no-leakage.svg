<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470"><rect width="1100" height="470" fill="white"/><text x="550" y="42" font-family="Arial" font-size="29" font-weight="bold" text-anchor="middle">Inside every CV fold: fit preprocessing only on the training portion</text><rect x="45" y="95" width="340" height="90" rx="10" fill="#d7e9f8" stroke="#5a88a7" stroke-width="2"/><rect x="45" y="272" width="340" height="90" rx="10" fill="#fff0d2" stroke="#be9751" stroke-width="2"/><g font-family="Arial" text-anchor="middle" fill="#223444"><text x="215" y="132" font-size="24" font-weight="bold">Fold training subset</text><text x="215" y="162" font-size="17">Learn missing-value means</text><text x="215" y="308" font-size="24" font-weight="bold">Fold validation subset</text><text x="215" y="340" font-size="17">Never call fit here</text></g><rect x="474" y="94" width="265" height="90" rx="10" fill="#d5eee0" stroke="#62966b" stroke-width="2"/><rect x="785" y="94" width="270" height="90" rx="10" fill="#d5eee0" stroke="#62966b" stroke-width="2"/><text x="606" y="134" font-family="Arial" text-anchor="middle" font-size="23">Imputer.fit</text><text x="606" y="162" font-family="Arial" text-anchor="middle" font-size="19">Scaler.fit</text><text x="918" y="133" font-family="Arial" text-anchor="middle" font-size="23">KNN.fit</text><text x="918" y="161" font-family="Arial" text-anchor="middle" font-size="18">Store fold examples</text><path d="M385 139 H466" stroke="#445e77" stroke-width="3"/><path d="M739 139 H777" stroke="#445e77" stroke-width="3"/><path d="M385 315 H605 V194" stroke="#aa8747" stroke-width="3" fill="none" stroke-dasharray="8 5"/><path d="M918 194 V315 H1055" stroke="#445e77" stroke-width="3" fill="none"/><text x="830" y="311" font-size="20" font-family="Arial">Predict &amp; score</text><text x="550" y="425" text-anchor="middle" font-family="Arial" font-size="21">Pipeline + cross_validate: refit imputer, scaler, and KNN independently in each fold</text></svg>