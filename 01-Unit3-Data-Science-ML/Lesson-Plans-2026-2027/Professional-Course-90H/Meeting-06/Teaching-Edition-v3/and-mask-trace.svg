<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 440" width="1130" height="440" role="img" aria-label="Four computer prices, two boolean masks, intersection selects B and C">
<rect width="1130" height="440" fill="white"/><text x="565" y="36" font-family="Arial" font-size="27" text-anchor="middle" fill="#16334c" font-weight="bold">Two tests, one row-wise AND mask</text><text x="565" y="65" font-family="Arial" font-size="16" text-anchor="middle" fill="#526a7b">Price at least 1500 NIS AND at most 4000 NIS</text><g font-family="Arial" fill="#16334c" font-size="17" text-anchor="middle"><text x="105" y="92">ID</text><text x="246" y="92">Price</text><text x="418" y="92">Memory</text><text x="590" y="92">>= 1500</text><text x="758" y="92">&lt;= 4000</text><text x="953" y="92">AND</text></g><rect x="45" y="100" width="1040" height="62" rx="8" fill="#f5f7fa" stroke="#ced9df"/><text x="105" y="138" font-family="Arial" font-size="22" text-anchor="middle" fill="#17344f">A</text><text x="246" y="138" font-family="Arial" font-size="20" text-anchor="middle" fill="#17344f">1000 NIS</text><text x="418" y="138" font-family="Arial" font-size="20" text-anchor="middle" fill="#17344f">16 GB</text><text x="590" y="138" font-family="Arial" font-size="19" text-anchor="middle" fill="#17344f">False</text><text x="758" y="138" font-family="Arial" font-size="19" text-anchor="middle" fill="#17344f">True</text><text x="953" y="138" font-family="Arial" font-size="23" text-anchor="middle" font-weight="bold" fill="#a2504a">SKIP</text><rect x="45" y="172" width="1040" height="62" rx="8" fill="#e7f6ee" stroke="#ced9df"/><text x="105" y="210" font-family="Arial" font-size="22" text-anchor="middle" fill="#17344f">B</text><text x="246" y="210" font-family="Arial" font-size="20" text-anchor="middle" fill="#17344f">2500 NIS</text><text x="418" y="210" font-family="Arial" font-size="20" text-anchor="middle" fill="#17344f">8 GB</text><text x="590" y="210" font-family="Arial" font-size="19" text-anchor="middle" fill="#17344f">True</text><text x="758" y="210" font-family="Arial" font-size="19" text-anchor="middle" fill="#17344f">True</text><text x="953" y="210" font-family="Arial" font-size="23" text-anchor="middle" font-weight="bold" fill="#22644b">SELECT</text><rect x="45" y="244" width="1040" height="62" rx="8" fill="#e7f6ee" stroke="#ced9df"/><text x="105" y="282" font-family="Arial" font-size="22" text-anchor="middle" fill="#17344f">C</text><text x="246" y="282" font-family="Arial" font-size="20" text-anchor="middle" fill="#17344f">4000 NIS</text><text x="418" y="282" font-family="Arial" font-size="20" text-anchor="middle" fill="#17344f">32 GB</text><text x="590" y="282" font-family="Arial" font-size="19" text-anchor="middle" fill="#17344f">True</text><text x="758" y="282" font-family="Arial" font-size="19" text-anchor="middle" fill="#17344f">True</text><text x="953" y="282" font-family="Arial" font-size="23" text-anchor="middle" font-weight="bold" fill="#22644b">SELECT</text><rect x="45" y="316" width="1040" height="62" rx="8" fill="#f5f7fa" stroke="#ced9df"/><text x="105" y="354" font-family="Arial" font-size="22" text-anchor="middle" fill="#17344f">D</text><text x="246" y="354" font-family="Arial" font-size="20" text-anchor="middle" fill="#17344f">4500 NIS</text><text x="418" y="354" font-family="Arial" font-size="20" text-anchor="middle" fill="#17344f">16 GB</text><text x="590" y="354" font-family="Arial" font-size="19" text-anchor="middle" fill="#17344f">True</text><text x="758" y="354" font-family="Arial" font-size="19" text-anchor="middle" fill="#17344f">False</text><text x="953" y="354" font-family="Arial" font-size="23" text-anchor="middle" font-weight="bold" fill="#a2504a">SKIP</text><text x="565" y="418" font-size="17" text-anchor="middle" font-family="Arial" fill="#47697e">Selected rows: B, C | Sort descending by price: C (4000), then B (2500)</text></svg>