<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" width="1120" height="490" role="img" aria-label="Computer prices A 1000, B 2500, C 4000, D 4500 NIS, range 1500 to 4000 inclusive">
