<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Manual KNN prediction flow: feature matrix plus correctly paired labels, query, distances, labeled sorting, first K rows, vote modes, if one mode return label, otherwise return None. Comparison with library on same X y K metric and tie policy.">
<rect width="1200" height="640" fill="white"/><text x="600" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#193f5b">predict_one — make every decision explainable</text>
<rect x="83" y="74" width="494" height="90" rx="12" fill="#e4f3eb" stroke="#b7ccd5"/><text x="330" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#22455c">Training X and matching y</text><text x="330" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#45667a">Five rows × two features, five labels</text>
<rect x="623" y="74" width="494" height="90" rx="12" fill="#eef2fa" stroke="#b7ccd5"/><text x="870" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#22455c">New query q and chosen K</text><text x="870" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#45667a">Unknown true label; K from 1 to 5</text>
<path d="M330 164 V188 H600 V212 M870 164 V188 H600" stroke="#547b8c" stroke-width="3" fill="none"/>
<rect x="280" y="215" width="640" height="82" rx="12" fill="#e8f4f8" stroke="#b7ccd5"/><text x="600" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#22455c">1. Compute distances</text><text x="600" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#45667a">Use euclidean_distance for every training row</text>
<path d="M600 297 V315" stroke="#547b8c" stroke-width="3"/>
<rect x="280" y="318" width="640" height="82" rx="12" fill="#e8f4f8" stroke="#b7ccd5"/><text x="600" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#22455c">2. Keep distance paired with its label</text><text x="600" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#45667a">Sort by distance; take exactly K rows</text>
<path d="M600 400 V418" stroke="#547b8c" stroke-width="3"/>
<rect x="280" y="420" width="640" height="82" rx="12" fill="#f9f1e5" stroke="#b7ccd5"/><text x="600" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#22455c">3. Count nearest-neighbor labels</text><text x="600" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#45667a">mode() may return more than one label</text>
<path d="M600 502 V524 H315 V539 M600 524 H885 V539" stroke="#547b8c" stroke-width="3"/>
<rect x="83" y="541" width="494" height="81" rx="12" fill="#e5f5ed" stroke="#b7ccd5"/><text x="330" y="571" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#22455c">One mode -> return label</text><text x="330" y="603" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#45667a">Prediction, not Accuracy</text>
<rect x="623" y="541" width="494" height="81" rx="12" fill="#faece7" stroke="#b7ccd5"/><text x="870" y="571" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#22455c">Several modes -> return None</text><text x="870" y="603" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#45667a">Explicit no-decision tie policy</text></svg>