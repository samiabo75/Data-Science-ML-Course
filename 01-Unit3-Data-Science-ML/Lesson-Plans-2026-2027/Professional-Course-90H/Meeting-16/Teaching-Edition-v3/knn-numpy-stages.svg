<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="545" viewBox="0 0 1160 545" role="img" aria-label="NumPy vector calculation u 1 2 minus v 4 6 equals minus3 minus4, square equals9 16, sum25, square root5. Matrix of five rows and two features uses sum axis1 to get five distances.">
<rect width="1160" height="545" fill="white"/><text x="580" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#1b425b">NumPy performs the same four hand-calculated steps</text>
<rect x="70" y="102" width="1020" height="68" rx="11" fill="#ebf4f9" stroke="#c2d4dc"/><text x="104" y="145" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#23465e">1. Subtract</text><text x="500" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#365a72">[1, 2] - [4, 6]</text><text x="976" y="145" text-anchor="end" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#236879">[-3, -4]</text><rect x="70" y="184" width="1020" height="68" rx="11" fill="#f0f8f5" stroke="#c2d4dc"/><text x="104" y="227" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#23465e">2. Square</text><text x="500" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#365a72">delta ** 2</text><text x="976" y="227" text-anchor="end" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#236879">[9, 16]</text><rect x="70" y="266" width="1020" height="68" rx="11" fill="#ebf4f9" stroke="#c2d4dc"/><text x="104" y="309" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#23465e">3. Sum</text><text x="500" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#365a72">np.sum(squared)</text><text x="976" y="309" text-anchor="end" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#236879">25</text><rect x="70" y="348" width="1020" height="68" rx="11" fill="#f0f8f5" stroke="#c2d4dc"/><text x="104" y="391" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#23465e">4. Square root</text><text x="500" y="391" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#365a72">np.sqrt(total)</text><text x="976" y="391" text-anchor="end" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#236879">5.0</text>
<rect x="145" y="458" width="870" height="56" rx="10" fill="#fcf0dd" stroke="#d7b889"/><text x="580" y="491" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#715630">For X with shape (5,2), sum(axis=1) sums TWO features per row and returns FIVE distances.</text></svg>