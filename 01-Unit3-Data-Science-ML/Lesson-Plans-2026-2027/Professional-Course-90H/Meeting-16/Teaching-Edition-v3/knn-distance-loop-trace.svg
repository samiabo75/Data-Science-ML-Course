"67" fill="#f6fafc" stroke="#bed1d9"/><text x="503" y="236.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#22465f" font-weight="normal">−3</text><rect x="601" y="197" width="153" height="67" fill="#f6fafc" stroke="#bed1d9"/><text x="677.5" y="236.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#22465f" font-weight="normal">9</text><rect x="754" y="197" width="313" height="67" fill="#f6fafc" stroke="#bed1d9"/><text x="910.5" y="236.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#22465f" font-weight="normal">9</text><rect x="63" y="264" width="100" height="67" fill="#edf6ef" stroke="#bed1d9"/><text x="113" y="303.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#22465f" font-weight="normal">1</text><rect x="163" y="264" width="121" height="67" fill="#edf6ef" stroke="#bed1d9"/><text x="223.5" y="303.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#22465f" font-weight="normal">2</text><rect x="284" y="264" width="121" height="67" fill="#edf6ef" stroke="#bed1d9"/><text x="344.5" y="303.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#22465f" font-weight="normal">6</text><rect x="405" y="264" width="196" height="67" fill="#edf6ef" stroke="#bed1d9"/><text x="503" y="303.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#22465f" font-weight="normal">−4</text><rect x="601" y="264" width="153" height="67" fill="#edf6ef" stroke="#bed1d9"/><text x="677.5" y="303.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#22465f" font-weight="normal">16</text><rect x="754" y="264" width="313" height="67" fill="#edf6ef" stroke="#bed1d9"/><text x="910.5" y="303.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#22465f" font-weight="normal">25</text>
<rect x="145" y="370" width="840" height="97" rx="15" fill="#f3f1df" stroke="#dbd39d"/><text x="565" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#695c36">return sqrt(total) = sqrt(9 + 16) = sqrt(25)</text><text x="565" y="446" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#345c5b">Distance = 5.0</text><text x="565" y="511" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#5b7285">The label and ID are never used in this distance formula.</text></svg>