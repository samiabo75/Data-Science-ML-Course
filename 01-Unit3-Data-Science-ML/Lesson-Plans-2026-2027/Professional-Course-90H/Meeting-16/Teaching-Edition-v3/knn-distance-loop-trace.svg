<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="545" viewBox="0 0 1130 545" role="img" aria-label="Distance loop trace between vectors u 1 2 and v 4 6: index0 diff minus3 square9 cumulative9; index1 diff minus4 square16 cumulative25; sqrt25 is5."><rect width="1130" height="545" fill="white"/><text x="565" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#18405a">A loop is the handwritten Euclidean-distance calculation</text><text x="565" y="79" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#4d6980">u = [1, 2]    v = [4, 6]    total starts at 0</text>
