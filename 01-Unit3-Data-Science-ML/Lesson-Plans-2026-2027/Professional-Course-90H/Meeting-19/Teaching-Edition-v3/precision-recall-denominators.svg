<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530"><rect width="900" height="530" fill="#fff"/><text x="450" y="42" font-size="27" font-family="DejaVu Sans,Arial" text-anchor="middle" font-weight="bold">Precision מול Recall — חיובי: פגום</text><text x="450" y="83" font-size="18" font-family="DejaVu Sans,Arial" text-anchor="middle">שורות: אמת | עמודות: חיזוי | 8 מוצרים מומצאים</text><text x="450" y="126" font-size="21" font-family="DejaVu Sans,Arial" text-anchor="middle">חיזוי</text><text x="354" y="157" font-size="21" font-family="DejaVu Sans,Arial" text-anchor="middle">תקין</text><text x="565" y="157" font-size="21" font-family="DejaVu Sans,Arial" text-anchor="middle">פגום</text><text x="192" y="238" font-size="18" font-family="DejaVu Sans,Arial" text-anchor="middle">אמת: תקין</text><text x="192" y="372" font-size="18" font-family="DejaVu Sans,Arial" text-anchor="middle">אמת: פגום</text><rect x="260" y="175" width="185" height="115" rx="6" fill="#e8f2f8" stroke="#5a7e94"/><rect x="450" y="175" width="185" height="115" rx="6" fill="#fde1c7" stroke="#bb8553"/><rect x="260" y="296" width="185" height="115" rx="6" fill="#f4d7db" stroke="#ba707c"/><rect x="450" y="296" width="185" height="115" rx="6" fill="#d5ecdc" stroke="#6e987a"/><g fill="#1e293b" font-family="DejaVu Sans,Arial" text-anchor="middle"><text x="352" y="210" font-size="19">TN</text><text x="352" y="263" font-size="40">3</text><text x="542" y="210" font-size="19">FP</text><text x="542" y="263" font-size="40">1</text><text x="352" y="332" font-size="19">FN</text><text x="352" y="383" font-size="40">2</text><text x="542" y="332" font-size="19">TP</text><text x="542" y="383" font-size="40">2</text></g><path d="M650 175 H680 V410 H650" fill="none" stroke="#2583a0" stroke-width="4"/><text x="691" y="247" font-size="18" font-family="DejaVu Sans,Arial">Precision</text><text x="691" y="274" font-size="19" font-family="DejaVu Sans,Arial">TP / (TP + FP)</text><text x="691" y="300" font-size="18" font-family="DejaVu Sans,Arial">2 / (2 + 1)</text><path d="M260 425 V445 H635 V425" fill="none" stroke="#9970c5" stroke-width="4"/><text x="448" y="478" font-size="20" text-anchor="middle" font-family="DejaVu Sans,Arial">Recall = TP / (TP + FN) = 2 / 4</text><text x="448" y="515" font-size="16" font-family="DejaVu Sans,Arial" text-anchor="middle">מכנים: נחזו כפגומים = 3 | פגומים באמת = 4</text></svg>